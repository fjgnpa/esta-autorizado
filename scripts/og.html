<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0a0d12;color:#eef2f7;position:relative;overflow:hidden}
.g{position:absolute;inset:0;background:radial-gradient(700px 380px at 20% 10%,rgba(16,185,129,.35),transparent 70%),radial-gradient(600px 360px at 85% 20%,rgba(14,165,233,.3),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px}
.c{position:relative;padding:72px 80px}.logo{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700}
.mk{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#10b981,#0ea5e9);display:grid;place-items:center}
h1{font-size:78px;line-height:1.02;letter-spacing:-.04em;margin:56px 0 24px;font-weight:800}.gr{background:linear-gradient(100deg,#34d399,#38bdf8);-webkit-background-clip:text;color:transparent}
p{font-size:28px;color:#b4bfcd;margin:0}.pills{display:flex;gap:14px;margin-top:40px}.p{font-size:22px;font-weight:650;padding:10px 20px;border-radius:99px}
.ok{background:#0f2a1c;color:#4ade80}.no{background:#2d1218;color:#fb7185}.lic{background:#141f3a;color:#93b4ff}
</style></head><body><div class="g"></div><div class="grid"></div><div class="c">
<div class="logo"><span class="mk"><svg width="30" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>¿Está autorizado?</div>

<div class="pills"><span class="p ok">✓ Puede operar en España</span><span class="p no">✗ No figura</span><span class="p lic">Licencia MiCA · Art. 59</span></div></div></body></html>
