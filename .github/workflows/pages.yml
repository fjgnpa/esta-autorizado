name: Actualizar registro y publicar
on:
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar poppler (lectura del PDF de la CNMV)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Pillow (normalizar logos nuevos)
        if: github.event_name != 'push'
        run: pip install pillow || echo "sin Pillow: se mantienen los logos en caché"
      - name: Refrescar datos (ESMA, BCE, CNMV) y generar sitio
        if: github.event_name != 'push'
        run: python3 scripts/refresh.py
      - name: Generar sitio con datos existentes
        if: github.event_name == 'push'
        run: python3 scripts/build_site.py
      - name: Guardar nueva instantánea en el repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Refresco semanal del registro MiCA ($(date -u +%F))"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
